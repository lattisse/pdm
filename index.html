<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Dark Mode</title>
<style>
:root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111111; color: #efefef; }
body { margin: 0; padding: 28px 18px; }
main { max-width: 760px; margin: auto; }
h1 { font-size: 1.8rem; }
p { color: #bcbcbc; line-height: 1.6; }
.panel { padding: 24px; border: 1px solid #444; background: #191919; }
input { display: block; max-width: 100%; margin: 16px 0; font: inherit; }
.drop-zone { padding: 22px; border: 2px dashed #555; text-align: center; transition: background .15s, border-color .15s; }
.drop-zone.dragging { border-color: #b6caff; background: #273148; }
.drop-zone input { margin: 16px auto 0; }
.drop-zone p { margin: 0 0 12px; }
.file-picker { display: inline-block; position: relative; }
.file-picker label { display: inline-block; text-decoration: underline; text-underline-offset: 4px; cursor: pointer; }
.file-picker input { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
.file-picker:focus-within label { outline: 3px solid #fff; outline-offset: 4px; }
.actions { margin-top: 20px; }
button, .download { display: inline-block; border: 0; padding: 12px 18px; background: #b6caff; color: #111; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
button:disabled { opacity: .5; cursor: wait; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
#status { white-space: pre-wrap; overflow-wrap: anywhere; }
#error { color: #ffb6b6; }
progress { width: 100%; accent-color: #b6caff; }
iframe { width: 100%; height: 75vh; border: 1px solid #444; margin-top: 22px; background: #111; }
[hidden] { display: none !important; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.secondary { background: #333; color: #efefef; }
#queue { list-style: none; padding: 0; margin: 20px 0 0; }
#queue li { padding: 16px 0; border-top: 1px solid #444; }
.file-name { font-weight: 600; overflow-wrap: anywhere; }
.file-status { margin: 6px 0 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.failed { color: #ffb6b6; }
#queue .actions button, #queue .download { padding: 8px 12px; font-size: .9rem; }
</style>
</head>
<body>
<main>
<h1>PDF Dark Mode</h1>
<div class="panel">
<div id="drop-zone" class="drop-zone">
<p>Drag and drop PDFs here</p>
<p>or</p>
<div class="file-picker">
<label for="file">Choose PDF</label>
<input id="file" type="file" accept=".pdf,application/pdf" multiple>
</div>
</div>
<div class="actions">
<button id="convert" type="button" disabled>Convert PDF</button>
<button id="clear" class="secondary" type="button" disabled>Clear queue</button>
</div>
<p id="status" role="status" aria-live="polite">Choose or drop PDFs to begin.</p>
<p id="error" role="alert" hidden></p>
<progress id="progress" max="1" value="0" hidden aria-label="Current PDF page progress"></progress>
<ul id="queue" aria-label="PDF conversion queue"></ul>
</div>
<p id="preview-name" hidden></p>
<iframe id="preview" title="Converted PDF preview" hidden></iframe>
</main>
<script>
'use strict';
let libraryPromise;
let busy = false;
let dragDepth = 0;
let queue = [];

function loadLibrary() {
    if (window.PDFLib) return Promise.resolve();
    if (libraryPromise) return libraryPromise;
    libraryPromise = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';
        script.crossOrigin = 'anonymous';
        script.referrerPolicy = 'no-referrer';
        script.onload = resolve;
        script.onerror = () => {
            script.remove();
            libraryPromise = null;
            reject(new Error('Could not load pdf-lib. Check your internet connection and try again.'));
        };
        document.head.appendChild(script);
    });
    return libraryPromise;
}

async function convertPdf(inputBytes, onProgress = () => {}) {
    const { PDFDocument, BlendMode, rgb } = PDFLib;
    const doc = await PDFDocument.load(inputBytes);
    const pages = doc.getPages();
    for (let i = 0; i < pages.length; i++) {
        const page = pages[i];
        const box = page.getMediaBox();
        const bounds = { x: box.x, y: box.y, width: box.width, height: box.height, borderWidth: 0 };
        // Invert channels, preserving original content, fonts, and image streams.
        page.drawRectangle({ ...bounds, color: rgb(1, 1, 1), blendMode: BlendMode.Difference });
        // Map white to #111111 and black to #efefef.
        const opacity = 33 / 255;
        const overlayChannel = 17 / 33;
        page.drawRectangle({
            ...bounds,
            color: rgb(overlayChannel, overlayChannel, overlayChannel),
            opacity,
            blendMode: BlendMode.Normal
        });
        // Add an explicit white backdrop underneath the original page content.
        const background = doc.context.flateStream(
            `q\n1 1 1 rg\n${box.x} ${box.y} ${box.width} ${box.height} re\nf\nQ\n`
        );
        const backgroundRef = doc.context.register(background);
        page.node.Contents().insert(0, backgroundRef);
        onProgress(i + 1, pages.length);
        if (i % 10 === 0) await new Promise(resolve => setTimeout(resolve, 0));
    }
    return doc.save();
}

const fileInput = document.getElementById('file');
const dropZone = document.getElementById('drop-zone');
const button = document.getElementById('convert');
const clearButton = document.getElementById('clear');
const status = document.getElementById('status');
const error = document.getElementById('error');
const progress = document.getElementById('progress');
const queueList = document.getElementById('queue');
const preview = document.getElementById('preview');
const previewName = document.getElementById('preview-name');

function showError(message) {
    error.textContent = message;
    error.hidden = false;
}

function hidePreview() {
    preview.hidden = true;
    preview.removeAttribute('src');
    previewName.hidden = true;
}

function showPreview(item) {
    preview.src = item.url;
    preview.hidden = false;
    previewName.textContent = 'Preview: ' + item.file.name;
    previewName.hidden = false;
}

function releaseItem(item) {
    if (item.url) {
        if (preview.getAttribute('src') === item.url) hidePreview();
        URL.revokeObjectURL(item.url);
    }
}

function renderQueue() {
    queueList.replaceChildren();
    for (const item of queue) {
        const row = document.createElement('li');
        const name = document.createElement('div');
        name.className = 'file-name';
        name.textContent = item.file.name;
        const detail = document.createElement('p');
        detail.className = 'file-status' + (item.state === 'error' ? ' failed' : '');
        detail.textContent = item.message;
        const actions = document.createElement('div');
        actions.className = 'actions';
        if (item.state === 'done') {
            const link = document.createElement('a');
            link.className = 'download';
            link.textContent = 'Download PDF';
            link.href = item.url;
            link.download = item.file.name.replace(/\.pdf$/i, '') + '_dark.pdf';
            actions.appendChild(link);
            const view = document.createElement('button');
            view.type = 'button';
            view.className = 'secondary';
            view.textContent = 'Preview';
            view.addEventListener('click', () => showPreview(item));
            actions.appendChild(view);
        }
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'secondary';
        remove.textContent = 'Remove';
        remove.setAttribute('aria-label', 'Remove ' + item.file.name);
        remove.disabled = busy;
        remove.addEventListener('click', () => {
            if (busy) return;
            releaseItem(item);
            queue = queue.filter(candidate => candidate !== item);
            renderQueue();
            status.textContent = queue.length ? `${queue.length} file(s) in the queue.` : 'Choose or drop PDFs to begin.';
        });
        actions.appendChild(remove);
        row.append(name, detail, actions);
        queueList.appendChild(row);
    }
    const pending = queue.filter(item => item.state === 'queued' || item.state === 'error');
    button.disabled = busy || pending.length === 0;
    button.textContent = 'Convert PDF';
    clearButton.disabled = busy || queue.length === 0;
    fileInput.disabled = busy;
}

function addFiles(files) {
    if (busy) return;
    error.hidden = true;
    const rejected = [];
    let added = 0;
    for (const file of Array.from(files || [])) {
        if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') {
            rejected.push(file.name);
            continue;
        }
        queue.push({ file, state: 'queued', message: 'Queued', url: null });
        added++;
    }
    renderQueue();
    if (added) status.textContent = `Added ${added} PDF(s). ${queue.length} file(s) in the queue. Press Convert to begin.`;
    if (rejected.length) showError('Skipped non-PDF files: ' + rejected.join(', '));
}

fileInput.addEventListener('change', () => {
    addFiles(fileInput.files);
    // Reset so the same file can be selected again after removal.
    fileInput.value = '';
});
clearButton.addEventListener('click', () => {
    if (busy) return;
    hidePreview();
    queue.forEach(releaseItem);
    queue = [];
    error.hidden = true;
    renderQueue();
    status.textContent = 'Choose or drop PDFs to begin.';
});

// Prevent the browser navigating away when files are dropped outside the zone.
window.addEventListener('dragover', event => event.preventDefault());
window.addEventListener('drop', event => {
    event.preventDefault();
    dragDepth = 0;
    dropZone.classList.remove('dragging');
});
dropZone.addEventListener('dragenter', event => {
    event.preventDefault();
    if (!busy) { dragDepth++; dropZone.classList.add('dragging'); }
});
dropZone.addEventListener('dragover', event => {
    event.preventDefault();
    if (event.dataTransfer) event.dataTransfer.dropEffect = busy ? 'none' : 'copy';
});
dropZone.addEventListener('dragleave', () => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) dropZone.classList.remove('dragging');
});
dropZone.addEventListener('drop', event => {
    event.preventDefault();
    dragDepth = 0;
    dropZone.classList.remove('dragging');
    if (busy) return;
    const files = event.dataTransfer?.files;
    if (!files?.length) { showError('Drop one or more PDF files here.'); return; }
    addFiles(files);
});

function assertPdf(bytes) {
    const header = new TextDecoder('latin1').decode(bytes.subarray(0, 1024));
    if (!header.includes('%PDF-')) throw new Error('This file does not contain a valid PDF header.');
}

button.addEventListener('click', async () => {
    if (busy) return;
    const batch = queue.filter(item => item.state === 'queued' || item.state === 'error');
    if (!batch.length) return;
    busy = true;
    error.hidden = true;
    dragDepth = 0;
    dropZone.classList.remove('dragging');
    renderQueue();
    progress.hidden = false;
    progress.removeAttribute('value');
    let succeeded = 0;
    let failed = 0;
    try {
        status.textContent = 'Loading PDF library…';
        await loadLibrary();
        for (let i = 0; i < batch.length; i++) {
            const item = batch[i];
            item.state = 'processing';
            item.message = 'Opening PDF…';
            progress.removeAttribute('value');
            status.textContent = `File ${i + 1} of ${batch.length}: ${item.file.name}`;
            renderQueue();
            try {
                const inputBytes = new Uint8Array(await item.file.arrayBuffer());
                assertPdf(inputBytes);
                const bytes = await convertPdf(inputBytes, (done, total) => {
                    progress.max = total;
                    progress.value = done;
                    item.message = `Converting page ${done} of ${total}…`;
                    status.textContent = `File ${i + 1} of ${batch.length}: ${item.file.name}\n${item.message}`;
                    // Update only the current row, keeping existing download links stable.
                    queueList.children[queue.indexOf(item)].querySelector('.file-status').textContent = item.message;
                });
                item.url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
                item.state = 'done';
                item.message = 'Ready to download';
                succeeded++;
                if (batch.length === 1) showPreview(item);
            } catch (e) {
                item.state = 'error';
                item.message = /encrypt/i.test(e.message || '')
                    ? 'This PDF is encrypted. Use an unlocked copy.'
                    : `Failed: ${e.message || String(e)}`;
                failed++;
            }
            renderQueue();
            // Let the browser paint between files, including very small PDFs.
            await new Promise(resolve => setTimeout(resolve, 0));
        }
        status.textContent = `Finished: ${succeeded} converted${failed ? `, ${failed} failed` : ''}.`;
    } catch (e) {
        showError(e.message || String(e));
        status.textContent = 'Could not start conversion. Your queue is preserved; try again.';
    } finally {
        busy = false;
        progress.hidden = true;
        renderQueue();
    }
});
window.addEventListener('beforeunload', () => queue.forEach(releaseItem));

</script>
</body>
</html>
