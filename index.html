<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Dark Mode</title>
<style>
:root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111111; color: #efefef; }
body { margin: 0; padding: 28px 18px; }
main { max-width: 760px; margin: auto; }
h1 { font-size: 1.8rem; }
p { color: #bcbcbc; line-height: 1.6; }
.panel { padding: 24px; border: 1px solid #444;  background: #191919; }
input { display: block; max-width: 100%; margin: 20px 0; }
button, .download { display: inline-block; border: 0;  padding: 12px 18px; background: #b6caff; color: #111; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
button:disabled { opacity: .5; cursor: wait; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
#status { white-space: pre-wrap; }
#error { color: #ffb6b6; }
progress { width: 100%; accent-color: #b6caff; }
iframe { width: 100%; height: 75vh; border: 1px solid #444;  margin-top: 22px; background: #111; }
[hidden] { display: none !important; }
code { color: #efefef; }
</style>
</head>
<body>
<main>
<h1>PDF Dark Mode</h1>
<div class="panel">
<label for="file">Choose a PDF</label>
<input id="file" type="file" accept=".pdf,application/pdf">
<button id="convert" type="button">Convert PDF</button>
<p id="status" role="status" aria-live="polite">Choose a file to begin.</p>
<p id="error" role="alert" hidden></p>
<progress id="progress" max="1" value="0" hidden></progress>
<a id="download" class="download" hidden>Download dark PDF</a>
</div>
<iframe id="preview" title="Converted PDF preview" hidden></iframe>
</main>
<script>
'use strict';
let resultUrl;
let libraryPromise;

function loadLibrary() {
    if (window.PDFLib) return Promise.resolve();
    if (libraryPromise) return libraryPromise;
    libraryPromise = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';
        script.crossOrigin = 'anonymous';
        script.referrerPolicy = 'no-referrer';
        script.onload = resolve;
        script.onerror = () => {
            script.remove();
            libraryPromise = null;
            reject(new Error('Could not load pdf-lib. Check your internet connection and try again.'));
        };
        document.head.appendChild(script);
    });
    return libraryPromise;
}


async function convertPdf(inputBytes, onProgress = () => {}) {
    const { PDFDocument, BlendMode, rgb } = PDFLib;
    const doc = await PDFDocument.load(inputBytes);
    const pages = doc.getPages();
    for (let i = 0; i < pages.length; i++) {
        const page = pages[i];
        const box = page.getMediaBox();
        const bounds = { x: box.x, y: box.y, width: box.width, height: box.height, borderWidth: 0 };

        // Append a white Difference overlay: each channel becomes 1 - channel.
        // The original page content, fonts, and image streams remain intact.
        page.drawRectangle({ ...bounds, color: rgb(1, 1, 1), blendMode: BlendMode.Difference });

        // Normal compositing produces output = 17/255 + (222/255)*(1-input).
        // Therefore white becomes #111111 and black becomes #efefef.
        const opacity = 33 / 255;
        const overlayChannel = 17 / 33;
        page.drawRectangle({
            ...bounds,
            color: rgb(overlayChannel, overlayChannel, overlayChannel),
            opacity,
            blendMode: BlendMode.Normal
        });

        // PDF page backgrounds can be transparent. Explicit white underneath
        // the original content gives the Difference overlay a white backdrop.
        // drawRectangle above normalizes and wraps the existing content streams.
        const background = doc.context.flateStream(
            `q\n1 1 1 rg\n${box.x} ${box.y} ${box.width} ${box.height} re\nf\nQ\n`
        );
        const backgroundRef = doc.context.register(background);
        page.node.Contents().insert(0, backgroundRef);
        onProgress(i + 1, pages.length);
        // Yield so the browser can paint progress updates.
        if (i % 10 === 0) await new Promise(resolve => setTimeout(resolve, 0));
    }
    return doc.save();
}

const fileInput = document.getElementById('file');
const button = document.getElementById('convert');
const status = document.getElementById('status');
const error = document.getElementById('error');
const progress = document.getElementById('progress');
const download = document.getElementById('download');
const preview = document.getElementById('preview');

button.addEventListener('click', async () => {
    const file = fileInput.files[0];
    if (!file) { status.textContent = 'Choose a PDF first.'; return; }
    button.disabled = true;
    fileInput.disabled = true;
    error.hidden = true;
    download.hidden = true;
    preview.hidden = true;
    preview.removeAttribute('src');
    if (resultUrl) { URL.revokeObjectURL(resultUrl); resultUrl = null; }
    progress.hidden = false;
    progress.value = 0;
    progress.max = 1;
    try {
        status.textContent = 'Loading PDF library…';
        await loadLibrary();
        status.textContent = 'Opening PDF…';
        const inputBytes = new Uint8Array(await file.arrayBuffer());
        const bytes = await convertPdf(inputBytes, (done, total) => {
            progress.max = total;
            progress.value = done;
            status.textContent = `Converting page ${done} of ${total}…`;
        });
        resultUrl = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
        download.href = resultUrl;
        download.download = file.name.replace(/\.pdf$/i, '') + '_dark.pdf';
        download.hidden = false;
        preview.src = resultUrl;
        preview.hidden = false;
        status.textContent = 'Ready. Download your converted PDF below.';
    } catch (e) {
        console.error(e);
        error.textContent = /encrypt/i.test(e.message)
            ? 'This PDF is encrypted. Use an unlocked copy and try again.'
            : `Conversion failed: ${e.message || String(e)}`;
        error.hidden = false;
        status.textContent = 'Could not convert this PDF.';
    } finally {
        button.disabled = false;
        fileInput.disabled = false;
        progress.hidden = true;
    }
});
window.addEventListener('beforeunload', () => { if (resultUrl) URL.revokeObjectURL(resultUrl); });
</script>
</body>
</html>
